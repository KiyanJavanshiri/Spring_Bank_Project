spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:

    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: create-drop
        defer-datasource-initialization: true
        show-sql: true
        properties:
          hibernate:
            format_sql: true


    sql:
      init:
        mode: always

    h2:
      console:
        enabled: true
        path: /h2-console

application:
  security:
    jwt:
      secret-key: rbmGM+Veq4Z42p9C+zcI//12TcZMFhGbaSqAU6mEPuo=
      expiration: 600000
